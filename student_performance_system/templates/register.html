{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4">
<h3 class="mb-4">Create account</h3>
<form method="post">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
  <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div>
  <div class="mb-3"><label class="form-label">USN</label><input class="form-control" name="usn" required></div>
  <div class="mb-3"><label class="form-label">Branch</label><input class="form-control" name="branch" required></div>
  <div class="mb-3"><label class="form-label">Semester</label><input class="form-control" type="number" name="semester" min="1" max="8" required></div>
  <button class="btn btn-primary w-100" type="submit">Register</button>
</form>
</div></div></div></div>
{% endblock %}
